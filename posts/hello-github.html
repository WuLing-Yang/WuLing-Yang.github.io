:root {

/* 主题一：浅色（默认，也用于“跟随系统”的浅色分支） */
:root {
  color-scheme: light;
  --bg: #f4f5f9;
  --surface: #ffffff;
  --text: #24292f;
  --text-soft: #57606a;
  --heading: #0d1117;
  --accent: #4f5dd0;
  --accent-strong: #3d49b5;
  --accent-weak: #eef1ff;
  --border: #d9dfe8;

  --code-text: #e6edf3;
  --inline-code-bg: rgba(79, 93, 208, .09);
  --inline-code-text: #3d49b5;
  --quote-border: #c9d1d9;
  --quote-bg: #f6f8fa;
  --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 6px 24px rgba(20, 30, 60, .07);
}
/* “跟随系统”时的深色分支 */
@media (prefers-color-scheme: dark) {

    color-scheme: dark;
    --bg: #0b0f17;
    --surface: #111827;
    --text: #d5dbe4;
    --text-soft: #8b95a5;
    --heading: #f3f4f6;
    --accent: #818cf8;
    --accent-strong: #a5b4fc;
    --accent-weak: rgba(129, 140, 248, .12);
    --border: #2a3441;
    --code-bg: #0a0e16;
    --code-text: #d5dbe4;
    --inline-code-bg: rgba(129, 140, 248, .12);
    --inline-code-text: #c7d2fe;
    --quote-border: #3b4554;
    --quote-bg: #161d2a;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 28px rgba(0, 0, 0, .4);
  }
}
/* 显式主题：属性选择器优先级高于 :root，可覆盖“跟随系统” */
html[data-theme="light"] {
  color-scheme: light;
  --bg: #f4f5f9;
  --surface: #ffffff;
  --text: #24292f;
  --text-soft: #57606a;
  --heading: #0d1117;

  --inline-code-text: #3d49b5;
  --quote-border: #c9d1d9;
  --quote-bg: #f6f8fa;
  --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 6px 24px rgba(20, 30, 60, .07);
}
html[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0b0f17;
  --surface: #111827;
  --text: #d5dbe4;
  --text-soft: #8b95a5;
  --heading: #f3f4f6;
  --accent: #818cf8;
  --accent-strong: #a5b4fc;
  --accent-weak: rgba(129, 140, 248, .12);
  --border: #2a3441;

  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 28px rgba(0, 0, 0, .4);
}
/* 主题：米黄护眼（暖色纸感） */
html[data-theme="paper"] {
  color-scheme: light;
  --bg: #f3ead6;
  --surface: #fbf6e9;
  --text: #43372a;
  --text-soft: #8a7a63;
  --heading: #2c2418;
  --accent: #a06a2f;
  --accent-strong: #8a5a26;
  --accent-weak: rgba(160, 106, 47, .13);
  --border: #e0d2b4;
  --code-bg: #3a3123;
  --code-text: #efe6cf;
  --inline-code-bg: rgba(160, 106, 47, .12);

  --quote-bg: #f7efda;
  --shadow: 0 1px 2px rgba(90, 70, 30, .06), 0 6px 24px rgba(90, 70, 30, .08);
}
/* 主题：蓝灰（静谧冷调） */
html[data-theme="blue"] {
  color-scheme: light;
  --bg: #e8eef6;
  --surface: #fbfdff;
  --text: #233140;
  --text-soft: #5d6b7b;
  --heading: #16212e;
  --accent: #2764a8;
  --accent-strong: #1d4f8a;
  --accent-weak: rgba(39, 100, 168, .12);
  --border: #c9d6e4;
  --code-bg: #16222e;
  --code-text: #d8e2ec;
  --inline-code-bg: rgba(39, 100, 168, .11);
  --inline-code-text: #1d5fa0;
  --quote-border: #b7c8da;
  --quote-bg: #f0f5fb;
  --shadow: 0 1px 2px rgba(22, 60, 100, .06), 0 6px 24px rgba(22, 60, 100, .08);
}

body {
  margin: 0;
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 1.75;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}

/* ---------- 顶栏 ---------- */
.topbar {
  position: sticky; top: 0; z-index: 50;
  background: var(--surface);
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  -webkit-backdrop-filter: saturate(1.4) blur(10px);
  backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid var(--border);
}
.topbar-inner {
  max-width: 1080px; margin: 0 auto; padding: .8rem 1.5rem;
  display: flex; align-items: center; gap: .75rem;
}
.brand {
  font-weight: 700; letter-spacing: .02em; color: var(--heading);
  display: flex; align-items: center; gap: .5rem;
}
.brand .dot {
  width: 9px; height: 9px; border-radius: 50%;
  background: linear-gradient(135deg, #818cf8, #4f5dd0);
  box-shadow: 0 0 0 3px var(--accent-weak);
}
.brand .back-link {
  text-decoration: none; color: var(--text-soft); font-weight: 600;
  font-size: .95rem; line-height: 1; transition: color .15s, transform .15s;
}
.brand .back-link:hover { color: var(--accent); transform: translateX(-2px); }
.topbar .spacer { flex: 1; }
.topbar .meta { font-size: .8rem; color: var(--text-soft); }
.theme-select {
  background: var(--surface); color: var(--text);
  border: 1px solid var(--border); border-radius: 8px;
  padding: .28rem .55rem; font-size: .8rem; font-family: inherit;
  cursor: pointer;
}
.theme-select:hover { border-color: var(--accent); }
.theme-select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.topbar-toggle {
  display: none; background: var(--accent-weak); color: var(--accent-strong);
  border: 1px solid var(--border); border-radius: 8px; padding: .3rem .8rem;
  font-size: .85rem; cursor: pointer; font-family: inherit;
}

/* ---------- 布局 ---------- */
.layout {
  max-width: 1080px; margin: 0 auto; padding: 1.5rem 1.5rem 3rem;
  display: grid; grid-template-columns: 250px minmax(0, 1fr);
  gap: 2.5rem; align-items: start;
}
main {
  min-width: 0; max-width: 46rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  box-shadow: var(--shadow);
  padding: 2.2rem 2.6rem;
}
@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; padding: 1rem; gap: 1rem; }
  main { padding: 1.4rem 1.2rem; }
  .topbar-toggle { display: inline-block; }
  nav#toc { display: none; }
  nav#toc.open { display: block; position: static; max-height: none; }
}

/* ---------- 文档头 ---------- */
.doc-head { margin-bottom: 1.6rem; padding-bottom: 1.2rem; border-bottom: 1px solid var(--border); }
.doc-label {
  display: inline-flex; align-items: center; gap: .4rem;
  font-size: .8rem; font-weight: 700; letter-spacing: .04em;
  color: var(--accent); background: var(--accent-weak);
  padding: .28rem .85rem; border-radius: 999px; margin-bottom: .55rem;
}
.doc-meta { display: flex; flex-wrap: wrap; gap: 1.1rem; font-size: .82rem; color: var(--text-soft); }
.doc-meta span { display: inline-flex; align-items: center; gap: .35rem; }

/* ---------- 侧边栏目录 ---------- */
nav#toc {
  position: sticky; top: 76px; max-height: calc(100vh - 96px); overflow: auto;
  padding: .25rem 0;
}
nav#toc .toc-title {
  font-size: .72rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  color: var(--text-soft); margin: 0 0 .6rem .35rem;
}
nav#toc ul { list-style: none; margin: 0; padding: 0; }
nav#toc ul ul { margin-left: .85rem; }
nav#toc a {
  display: block; padding: .26rem .6rem; margin: 1px 0;
  border-radius: 7px; color: var(--text-soft); text-decoration: none;
  font-size: .87rem; line-height: 1.4;
  border-left: 2px solid transparent;
  transition: color .15s, background .15s, border-color .15s;
}
nav#toc a:hover { color: var(--heading); background: var(--accent-weak); }
nav#toc a.active {
  color: var(--accent-strong); background: var(--accent-weak);
  border-left-color: var(--accent);
  font-weight: 600;
}

/* ---------- 正文排版 ---------- */
main h1, main h2, main h3, main h4, main h5, main h6 {
  color: var(--heading); line-height: 1.3; scroll-margin-top: 90px;
}
main h1 { font-size: 1.75rem; font-weight: 800; margin: 1.6em 0 .6em; letter-spacing: -.015em; }
main h1:first-child { margin-top: 0; }
main h2 {
  font-size: 1.42rem; font-weight: 700; margin: 2em 0 .6em; letter-spacing: -.01em;
  padding-bottom: .35em; border-bottom: 1px solid var(--border);
}
main h3 { font-size: 1.16rem; font-weight: 700; margin: 1.7em 0 .45em; }
main h4 { font-size: 1.02rem; font-weight: 650; margin: 1.4em 0 .35em; }
main p { margin: .85em 0; }
main a { color: var(--accent-strong); text-decoration: none; border-bottom: 1px solid transparent; }
main a:hover { border-bottom-color: currentColor; }
strong { color: var(--heading); font-weight: 650; }

main code {
  font-family: var(--font-mono); font-size: .87em;
  background: var(--inline-code-bg); color: var(--inline-code-text);
  padding: .16em .38em; border-radius: 5px;
  border: 1px solid var(--border);
}
main pre.codehilite {
  font-family: var(--font-mono); font-size: .875rem; line-height: 1.65;
  margin: 1.2em 0; padding: 1.1rem 1.25rem; overflow-x: auto;
  background: var(--code-bg); color: var(--code-text);
  border-radius: 10px; border: 1px solid rgba(255, 255, 255, .07);
  position: relative;
}
main pre.codehilite[data-lang] { padding-top: 2.45rem; }
main pre.codehilite[data-lang]::before {
  content: attr(data-lang);
  position: absolute; top: .45rem; left: 1.25rem;
  font-size: .68rem; font-weight: 600; letter-spacing: .06em; text-transform: lowercase;
  color: #8b95a5; font-family: var(--font-sans);
}
main pre.codehilite code {
  font-family: inherit; font-size: inherit; background: transparent;
  border: 0; color: inherit; padding: 0;
}
main pre.codehilite code * { font-family: inherit; }

.copy-btn {
  position: absolute; top: .5rem; right: .6rem; z-index: 5;
  font-family: var(--font-sans); font-size: .72rem;
  color: #9aa4b2; background: rgba(255, 255, 255, .06);
  border: 1px solid rgba(255, 255, 255, .14); border-radius: 6px;
  padding: .2rem .6rem; cursor: pointer; opacity: 0; transition: opacity .18s, color .18s, background .18s;
}
pre.codehilite:hover .copy-btn { opacity: 1; }
.copy-btn:hover { color: #fff; background: rgba(255, 255, 255, .14); }

/* 列表 */
main ul, main ol { padding-left: 1.35em; margin: .7em 0; }
main li { margin: .28em 0; }
main li > ul, main li > ol { margin: .2em 0; }
main li::marker { color: var(--accent); font-weight: 600; }

/* 引用块 */
main blockquote {
  margin: 1.2em 0; padding: .55em 1.1em;
  border-left: 3px solid var(--accent);
  background: var(--quote-bg); border-radius: 0 8px 8px 0;
  color: var(--text-soft);
}
main blockquote p { margin: .4em 0; }
main blockquote blockquote { border-left-color: var(--quote-border); background: transparent; }

/* 表格 */
main .table-wrap { width: 100%; overflow-x: auto; margin: 1.2em 0; border-radius: 8px; border: 1px solid var(--border); }
main .table-wrap table { margin: 0; }
main .table-wrap th:first-child, main .table-wrap td:first-child { padding-left: .95rem; }
main table { width: 100%; border-collapse: collapse; font-size: .9rem; }
main th, main td { border: 1px solid var(--border); padding: .5rem .85rem; text-align: left; }
main th { background: var(--quote-bg); font-weight: 650; color: var(--heading); }
main tr:nth-child(even) td { background: var(--quote-bg); }

/* 分割线 */
main hr { border: 0; height: 1px; margin: 2.2em 0; background: linear-gradient(90deg, transparent, var(--border), transparent); }

/* LaTeX 公式（内容由 KaTeX 渲染后替换） */
.math.inline { white-space: nowrap; }
.math.block {
  display: block; text-align: center; margin: 1.2em 0;
  padding: .3em 0; overflow-x: auto; overflow-y: hidden;
  font-size: 1.02em;
}
.math.block .katex-display { margin: 0; }

/* 任务列表 */
main .task-list-item { list-style: none; }
main .task-list-item input { margin-right: .45em; accent-color: var(--accent); }

/* 定义列表 */
main dl { margin: .7em 0; }
main dt { font-weight: 700; color: var(--heading); margin-top: .9em; }
main dd { margin: .2em 0 .6em 1.2em; }

/* 脚注 */
.footnote-ref { font-size: .75em; vertical-align: super; }
.footnote-ref a { text-decoration: none; }
.footnotes { font-size: .85rem; color: var(--text-soft); border-top: 1px solid var(--border); margin-top: 2.5em; padding-top: 1em; }
.footnotes hr { display: none; }

/* 删除线 */
main del, main s { color: var(--text-soft); }

/* ---------- 页脚 ---------- */
footer {
  max-width: 1080px; margin: 0 auto; padding: 0 1.5rem 2.5rem;
  text-align: center; font-size: .8rem; color: var(--text-soft);
}

/* ---------- 打印 ---------- */
@media print {
  .topbar, nav#toc, .copy-btn, footer { display: none !important; }
  body { background: #fff; }
  main { border: 0; box-shadow: none; max-width: none; padding: 0; }
  main h1, main h2, main h3, main h4 { scroll-margin-top: 0; break-after: avoid-page; }
  pre, blockquote, table { break-inside: avoid-page; }
}

<script>
(function () {
  // 目录滚动高亮
  var links = Array.prototype.slice.call(document.querySelectorAll('#toc a'));
  var ids = links.map(function (a) { return a.getAttribute('href').slice(1); });
  function pick() {
    var current = null;
    for (var i = 0; i < ids.length; i++) {
      var el = document.getElementById(ids[i]);
      if (el && el.getBoundingClientRect().top <= 96) current = ids[i];
    }
    links.forEach(function (a) {
      a.classList.toggle('active', a.getAttribute('href') === '#' + current);
    });
  }
  var ticking = false;
  window.addEventListener('scroll', function () {
    if (!ticking) {
      requestAnimationFrame(function () { pick(); ticking = false; });
      ticking = true;
    }
  }, { passive: true });
  pick();

  // 移动端目录展开
  var toggle = document.querySelector('.topbar-toggle');
  var toc = document.querySelector('nav#toc');
  if (toggle && toc) {
    toggle.addEventListener('click', function () {
      toc.classList.toggle('open');
      toggle.textContent = toc.classList.contains('open') ? '收起目录' : '目录';
    });
  }

  // 代码复制按钮
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function (resolve, reject) {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); resolve(); }
      catch (e) { reject(e); }
      document.body.removeChild(ta);
    });
  }
  document.querySelectorAll('pre.codehilite').forEach(function (block) {
    var btn = document.createElement('button');
    btn.className = 'copy-btn';
    btn.type = 'button';
    btn.textContent = '复制';
    btn.addEventListener('click', function () {
      var code = block.querySelector('code');
      copyText(code ? code.innerText : '').then(function () {
        btn.textContent = '已复制 ✓';
        setTimeout(function () { btn.textContent = '复制'; }, 1600);
      });
    });
    block.appendChild(btn);
  });

  // 主题切换（localStorage 持久化，默认跟随系统）
  var KEY = 'md2html-theme';
  var themeSel = document.getElementById('theme-select');
  if (themeSel) {
    var saved = null;
    try { saved = localStorage.getItem(KEY); } catch (e) {}
    if (saved && ['light', 'dark', 'paper', 'blue', 'system'].indexOf(saved) >= 0) {
      document.documentElement.setAttribute('data-theme', saved);
      themeSel.value = saved;
    } else {
      themeSel.value = 'system';
    }
    themeSel.addEventListener('change', function () {
      var v = themeSel.value;
      document.documentElement.setAttribute('data-theme', v);
      try { localStorage.setItem(KEY, v); } catch (e) {}
    });
  }
})();
</script>
